# Render Blueprint for the Stockmonsters game server.
# The database lives on the persistent disk; the NFT update-authority key is a
# secret set in the Render dashboard (never committed).
services:
  - type: web
    name: stockmonsters-server
    runtime: docker
    plan: starter            # WebSockets + a persistent disk need a paid instance
    region: oregon
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /data/stockmonsters.db
      - key: STATIC_DIR
        value: /app/no-static     # the page is served by Vercel (stockmonsters.app)
      - key: ALLOWED_ORIGINS
        value: https://stockmonsters.app,https://www.stockmonsters.app,https://stock-delta-tan.vercel.app,https://stock-ljiulguis-projects.vercel.app
      - key: PUBLIC_URL
        value: https://stockmonsters-server.onrender.com
      - key: NFT_CHAIN_ID
        value: "1"              # Ethereum mainnet
      - key: NFT_CONTRACT       # StockMonsters address, after contracts/ is deployed
        sync: false
      - key: NFT_SIGNER_KEY     # 0x private key from data/signer.json (voucher key, holds no ETH)
        sync: false
      - key: ETH_RPC_URL        # a paid RPC (Alchemy, Infura, QuickNode) is strongly recommended
        sync: false
